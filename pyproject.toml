[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-pen-tracking"
version = "0.1.0"
description = "Camera pen tracking prototype for NG04"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<2", "opencv-contrib-python>=4.8,<4.12"]

[project.optional-dependencies]
hands = ["mediapipe==0.10.21"]

[project.scripts]
pen-track = "pen_tracking.app:main"

[tool.setuptools.packages.find]
include = ["pen_tracking*"]
